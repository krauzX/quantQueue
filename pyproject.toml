[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantqueue"
version = "0.1.0"
description = "Async priority scheduling and caching for quantum workloads"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
qiskit = ["qiskit>=2.0", "qiskit-aer>=0.15"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.8"]

[tool.setuptools.packages.find]
include = ["quantqueue*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"__tests__/*" = ["E501"]

